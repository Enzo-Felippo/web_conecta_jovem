<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 01: Parágrafos e quebras de linha</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever 
        um parágrafo de 
        qualquer jeito.
        Basta colocar tudo no 
        meio da tag &lt;p&gt;.
    </p>
    <!--
        &lt; - < - Less Than
        &gt; - > - Greater Than
    -->

    <p>Se quiser quebrar o texto em algum lugar
        basta usar a tag &lt;br&gt;.
        <br>
        Como nesse caso
    </p>
</body>
</html>
