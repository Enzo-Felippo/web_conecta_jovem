<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- Referência ao arquivo CSS externo -->
  <link rel="stylesheet" href="css/loja.css">

  <title>Exemplo de Loja Virtual</title>
</head>
<body>

  <!-- Exemplo de itens em uma loja virtual -->
  <h2>Produtos em Destaque</h2>

  <table border="1">
    <tr>
      <th>Imagem</th>
      <th>Produto</th>
      <th>Preço</th>
      <th>Link</th>
    </tr>

    <tr>
      <td>
        <img src="imagens/camiseta.png" alt="Camiseta" width="60">
      </td>
      <td>Camiseta Conecta</td>
      <td>R$ 49,90</td>
      <td><a href="#">Comprar</a></td>
    </tr>

    <tr>
      <td>
        <img src="imagens/bone.png" alt="Boné" width="60">
      </td>
      <td>Boné Azul</td>
      <td>R$ 39,90</td>
      <td><a href="#">Comprar</a></td>
    </tr>
  </table>

</body>
</html>
